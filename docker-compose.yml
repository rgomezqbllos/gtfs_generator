services:
  app:
    build: .
    ports:
      - "3001:3001"
    volumes:
      - ./gtfs_data:/data
      # [CRÍTICO] Docker socket required for dynamic OSRM container management (OsrmService.ts).
      # Mitigation: restrict access to trusted network only. Long-term: replace with Docker SDK over TCP + mTLS.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    environment:
      - HOST_PROJECT_PATH=${PWD:-.}
      - PORT=3001
      - DB_PATH=/data/gtfs.db
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - OSRM_BASE_URL=http://host.docker.internal
      - OSRM_DOCKER_NETWORK=gtfs_generator_default
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173}

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.1
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
      KC_HTTP_PORT: 8080
    volumes:
      - ./import:/opt/keycloak/data/import
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
